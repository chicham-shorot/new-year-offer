<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Year Offer</title>
    <!-- link of styles file -->
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <header>
      <!-- banner section start here  -->
      <section class="banner-container">
        <div class="banner-content">
          <h2 class="banner-subtitle">Happy New Year</h2>
          <h1 class="banner-title">New Year Party Celebration</h1>
        </div>
      </section>
    </header>
    <main>
      <!-- New year offer section start here  -->
      <section class="offer-container">
        <div class="offer-content">
          <h1 class="offer-title">65% OFF</h1>
          <p class="offer-description">OUR HOLIDAY DEALS ARE BETTER</p>
          <h2 class="offer-subtitle">ALL CATEGORIES</h2>
        </div>
        <div class="offer-img">
          <img
            src="./images/New Year Photo.png"
            alt="This is just new year image."
          />
        </div>
      </section>
      <!-- Midnight party section start here  -->
      <section class="midnight-party-container">
        <div class="midnight-party-content">
          <h1 class="midnight-party-title">Welcome to<br> midnight party</h1>
          <p class="midnight-party-description">Dolor sit amet consectetur. Consequat eget consectetur maecenas sed molestie malesuada. Ipsum sed sodales risus ut pellentesque vel euismod. </p>
          <button class="midnight-party-btn">JOIN NOW</button>
        </div>
        <div class="midnight-party-img">
            <img src="./images/Group 70.png" alt="This is a year logo.">
        </div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
